version: '3.8'

services:
  service-discovery:
    build: ./service-discovery
    container_name: service-discovery
    ports:
      - "8761:8761"

  config-service:
    build: ./config-service
    container_name: config-service
    ports:
      - "8888:8888"
    depends_on:
      - service-discovery
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka

  apigateway-service:
    build: ./apigateway-service
    container_name: apigateway-service
    ports:
      - "8000:8000"
    depends_on:
      - service-discovery
      - config-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8081:8081"
    depends_on:
      - service-discovery
      - config-service
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-service:8888
      - SPRING_APPLICATION_JSON={"eureka":{"client":{"service-url":{"defaultZone":"http://service-discovery:8761/eureka/"}}}}

  commerce-service:
    build: ./commerce-service
    container_name: commerce-service
    ports:
      - "8082:8082"
    depends_on: [service-discovery, config-service, kafka]
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-service:8888
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ZEROPICK_SCHEMA_REGISTRY_URL=http://schema-registry:8085
      - SPRING_APPLICATION_JSON={"eureka":{"client":{"service-url":{"defaultZone":"http://service-discovery:8761/eureka/"}}}}

  recommendation-service:
    build: ./recommendation-service
    container_name: recommendation-service
    ports:
      - "8083:8083"
    depends_on: [service-discovery, config-service, kafka, schema-registry]
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-service:8888
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8085
      - LLM_API_KEY=${LLM_API_KEY:-}
      - SPRING_APPLICATION_JSON={"eureka":{"client":{"service-url":{"defaultZone":"http://service-discovery:8761/eureka/"}}}}

  stock-service:
    build: ./stock-service
    container_name: stock-service
    ports:
      - "8084:8084"
    depends_on: [service-discovery, config-service]
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-service:8888
      - SPRING_APPLICATION_JSON={"eureka":{"client":{"service-url":{"defaultZone":"http://service-discovery:8761/eureka/"}}}}

  pos-sync-service:
    build: ./pos-sync-service
    container_name: pos-sync-service
    ports:
      - "8086:8086"
    depends_on: [service-discovery, config-service, kafka]
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-service:8888
      - KAFKA_BOOTSTRAP=kafka:29092
      - SPRING_APPLICATION_JSON={"eureka":{"client":{"service-url":{"defaultZone":"http://service-discovery:8761/eureka/"}}}}

  # ── CDC 스택 (RTL-H 핵심기술 이식) ──────────────────────────────
  pos-db:
    image: mariadb:11.8
    container_name: pos-db
    ports:
      - "3307:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=pos1234
      - MARIADB_DATABASE=pos
    command: >
      --log-bin=binlog
      --binlog-format=ROW
      --server-id=184001
    volumes:
      - ./cdc/pos-init.sql:/docker-entrypoint-initdb.d/pos-init.sql

  settlement-db:
    image: mariadb:11.8
    container_name: settlement-db
    ports:
      - "3308:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=stl1234
      - MARIADB_DATABASE=settlement
    volumes:
      - ./cdc/settlement-init.sql:/docker-entrypoint-initdb.d/settlement-init.sql

  cdc-connect:
    image: debezium/connect:2.7.3.Final
    container_name: cdc-connect
    depends_on: [kafka, pos-db]
    ports:
      - "8283:8083"
    environment:
      - BOOTSTRAP_SERVERS=kafka:29092
      - GROUP_ID=cdc-connect-group
      - CONFIG_STORAGE_TOPIC=cdc-connect-configs
      - OFFSET_STORAGE_TOPIC=cdc-connect-offsets
      - STATUS_STORAGE_TOPIC=cdc-connect-status
      - CONFIG_STORAGE_REPLICATION_FACTOR=1
      - OFFSET_STORAGE_REPLICATION_FACTOR=1
      - STATUS_STORAGE_REPLICATION_FACTOR=1

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: schema-registry
    ports:
      - "8085:8085"
    depends_on:
      - kafka
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8085

  kafka-topic-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-topic-init
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Kafka 기동 대기 중...'
      cub kafka-ready -b kafka:29092 1 30
      echo '토픽 생성 중...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic product-viewed --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic cart-added --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic order-completed --partitions 3 --replication-factor 1
      echo '토픽 생성 완료'
      "
