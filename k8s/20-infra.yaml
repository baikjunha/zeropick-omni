apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-discovery
  namespace: zeropick
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-discovery
  template:
    metadata:
      labels:
        app: service-discovery
    spec:
      containers:
        - name: service-discovery
          image: zeropick/service-discovery:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: service-discovery
  namespace: zeropick
spec:
  selector:
    app: service-discovery
  ports:
    - port: 8761
      targetPort: 8761
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  namespace: zeropick
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-service
  template:
    metadata:
      labels:
        app: config-service
    spec:
      containers:
        - name: config-service
          image: zeropick/config-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8888
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://service-discovery:8761/eureka
---
apiVersion: v1
kind: Service
metadata:
  name: config-service
  namespace: zeropick
spec:
  selector:
    app: config-service
  ports:
    - port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway-service
  namespace: zeropick
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway-service
  template:
    metadata:
      labels:
        app: apigateway-service
    spec:
      containers:
        - name: apigateway-service
          image: zeropick/apigateway-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://service-discovery:8761/eureka
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway-service
  namespace: zeropick
spec:
  type: NodePort
  selector:
    app: apigateway-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
