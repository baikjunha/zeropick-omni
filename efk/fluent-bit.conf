[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /logs/*.log
    Tag               zeropick.<filename>
    Tag_Regex         (?<filename>[^/]+)\.log$
    Path_Key          file
    Refresh_Interval  5
    Read_from_Head    true
    Multiline.parser  java

[FILTER]
    Name    modify
    Match   zeropick.*
    Add     stack zeropick-omni

[OUTPUT]
    Name                es
    Match               zeropick.*
    Host                elasticsearch
    Port                9200
    Index               zeropick-logs
    Suppress_Type_Name  On
    Replace_Dots        On
    Retry_Limit         5
