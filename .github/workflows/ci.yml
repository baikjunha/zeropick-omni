name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - config-service
          - service-discovery
          - apigateway-service
          - product-service
          - commerce-service
          - recommendation-service
          - stock-service
          - pos-sync-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp package
      - name: Docker image build
        working-directory: ${{ matrix.service }}
        run: docker build -t ghcr.io/${{ github.repository_owner }}/zeropick-${{ matrix.service }}:latest .
      - name: GHCR login and push (main)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/zeropick-${{ matrix.service }}:latest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
