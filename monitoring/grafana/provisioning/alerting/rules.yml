apiVersion: 1
groups:
  - orgId: 1
    name: zeropick-alerts
    folder: ZeroPick
    interval: 1m
    rules:
      - uid: zp-dlq-alert
        title: POS 동기화 DLQ 적재 (재고 불일치 위험)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prom
            model:
              expr: possync_dlq_count
              refId: A
              instant: true
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { params: [0], type: gt }
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: CDC 이벤트가 DLQ에 적재됐다. POS와 재고 원장이 불일치할 수 있다.
        labels:
          severity: warning
      - uid: zp-lag-alert
        title: Kafka Consumer Lag 누적
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prom
            model:
              expr: sum(kafka_consumergroup_lag)
              refId: A
              instant: true
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { params: [500], type: gt }
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: 컨슈머 그룹 랙 합계가 500을 넘었다. 소비 지연을 확인하라.
        labels:
          severity: warning
